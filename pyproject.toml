[project]
name = "news-agent"
version = "0.1.0"
description = "Daily AI / agents / data-science digest tailored to ecommerce & fashion"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "google-genai>=1.0",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "trafilatura>=1.12",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
news-agent = "news_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
