name: Daily digest

on:
  schedule:
    # GitHub delays (and under load drops) scheduled runs, especially at the top of the hour, so the
    # primary slot is off the hour and two backups follow. A run skips itself when today's digest
    # (digests/daily/<local date>.html on main) already exists, so you still get one email per day.
    # Vietnam time (ICT, UTC+7, no daylight saving), Mon-Fri; a run takes ~5 min:
    - cron: "53 0 * * 1-5"    # primary  07:53 ICT -> email ~08:00
    - cron: "31 1 * * 1-5"    # backup 1 08:31 ICT
    - cron: "11 2 * * 1-5"    # backup 2 09:11 ICT
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore weekday guard"
        type: boolean
        default: true
      dry_run:
        description: "Dry run (no email, no state changes)"
        type: boolean
        default: false
      since:
        description: "Look-back window in hours (blank = default)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-agent-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest state (a delayed run must see commits made by earlier runs)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Run daily digest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          ARCHIVE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/digests
          NEWS_AGENT_ROOT: ${{ github.workspace }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ -n "${{ inputs.since }}" ] && ARGS="$ARGS --since ${{ inputs.since }}"
          fi
          python -m news_agent daily $ARGS

      - name: Upload preview (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/

      - name: Commit state and digest
        # always(): feedback votes are removed from Gmail early in the run, so persist
        # data/feedback.json even if a later step (e.g. sending) fails.
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "news-agent[bot]"
          git config user.email "news-agent[bot]@users.noreply.github.com"
          git add data digests
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "digest: daily $(TZ=Asia/Ho_Chi_Minh date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
